name: RaceDay CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore API
        run: dotnet restore RaceDay.API/RaceDay.API.csproj
      - name: Build API
        run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release --no-restore
      - name: Restore MVC
        run: dotnet restore RaceDay.MVC/RaceDay.MVC.csproj
      - name: Build MVC
        run: dotnet build RaceDay.MVC/RaceDay.MVC.csproj --configuration Release --no-restore
      - name: Run API tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release
